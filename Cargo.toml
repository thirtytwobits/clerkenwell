[workspace]
members = ["crates/*", "examples/*", "tools/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.95"
license = "MIT"
version = "0.13.0"
repository = "https://github.com/thirtytwobits/clerkenwell"

# The approved Rust/npm Loro release pair and its source live in
# loro-release.json.
[workspace.dependencies]
base64 = "0.23"
clapham = { git = "https://github.com/thirtytwobits/clapham", tag = "v0.4.0", version = "0.4.0" }
clapham-cli = { git = "https://github.com/thirtytwobits/clapham", tag = "v0.4.0", version = "0.4.0" }
clapham-conformance = { git = "https://github.com/thirtytwobits/clapham", tag = "v0.4.0", version = "0.4.0" }
clapham-mcp-server = { git = "https://github.com/thirtytwobits/clapham", tag = "v0.4.0", version = "0.4.0" }
clap = { version = "4.5", features = ["derive"] }
icu_collator = "2.1"
indexmap = "2.12"
jsonschema = { version = "0.60", default-features = false }
loro = { git = "https://github.com/thirtytwobits/loro.git", rev = "ef1964a317d743ebd5c0419d35393ff980daa2fe" }
schemars = "1.2.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.20"
thiserror = "2.0.17"

# Workspace patches do not propagate to dependents: every workspace that
# builds these crates carries this override too.
[patch.crates-io]
generic-btree = { git = "https://github.com/thirtytwobits/loro.git", rev = "ef1964a317d743ebd5c0419d35393ff980daa2fe" }
