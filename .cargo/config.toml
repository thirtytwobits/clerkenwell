# Keep macOS debug info in a `.dSYM` beside each binary. Cargo's macOS
# default, `unpacked`, leaves every build's object files in `target/*/deps`
# and never removes them.
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "split-debuginfo=packed"]

# Rustdoc warnings, broken intra-doc links among them, fail the documentation
# build here and in CI alike.
[build]
rustdocflags = ["-D", "warnings"]
