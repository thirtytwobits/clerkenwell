[package]
name = "clerkenwell-example-notes"
description = "A walk-through of Clerkenwell over one collaborative note"
publish = false
default-run = "clerkenwell-example-notes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8.8", default-features = false, features = ["tokio", "http1"] }
clap.workspace = true
clerkenwell-axum = { path = "../../crates/clerkenwell-axum" }
clerkenwell-doc = { path = "../../crates/clerkenwell-doc" }
clerkenwell-events = { path = "../../crates/clerkenwell-events" }
clerkenwell-schema = { path = "../../crates/clerkenwell-schema" }
clerkenwell-session = { path = "../../crates/clerkenwell-session" }
clerkenwell-store = { path = "../../crates/clerkenwell-store" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.50.0", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
clerkenwell-codegen = { path = "../../crates/clerkenwell-codegen" }
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.50.0", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.30.0"
