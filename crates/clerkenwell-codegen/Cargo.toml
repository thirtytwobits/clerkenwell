[package]
name = "clerkenwell-codegen"
description = "Validates a projection definition and generates its Rust, TypeScript and fixture artefacts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap.workspace = true
icu_collator.workspace = true
indexmap.workspace = true
jsonschema.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true

[features]
# The generator's internals, for Clerkenwell's own tests.
testing = []

[dev-dependencies]
clerkenwell-codegen = { path = ".", features = ["testing"] }
clerkenwell-notebook = { path = "../clerkenwell-notebook" }
clerkenwell-schema = { path = "../clerkenwell-schema" }
schemars.workspace = true
tempfile.workspace = true
