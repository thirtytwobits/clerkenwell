[package]
name = "clerkenwell-store"
description = "Durable single-authority storage for collaborative documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
clerkenwell-doc = { path = "../clerkenwell-doc" }
clerkenwell-events = { path = "../clerkenwell-events" }
clerkenwell-schema = { path = "../clerkenwell-schema" }
hmac = "0.13.0"
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
uuid = { version = "1", features = ["v4"] }

[features]
# The stored envelope format, for Clerkenwell's own tests.
testing = []

[dev-dependencies]
clerkenwell-store = { path = ".", features = ["testing"] }
jiff.workspace = true
loro.workspace = true
