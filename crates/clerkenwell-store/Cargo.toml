[package]
name = "clerkenwell-store"
description = "Durable single-authority storage for collaborative documents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clerkenwell-doc = { path = "../clerkenwell-doc" }
clerkenwell-events = { path = "../clerkenwell-events" }
clerkenwell-schema = { path = "../clerkenwell-schema" }
fs2 = "0.4"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
uuid = { version = "1", features = ["v4"] }

[features]
# The stored envelope format, for Clerkenwell's own tests.
testing = []

[dev-dependencies]
clerkenwell-store = { path = ".", features = ["testing"] }
loro.workspace = true
tempfile = "3"
