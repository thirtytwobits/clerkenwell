[package]
name = "clerkenwell-conformance"
description = "Cross-language conformance: Rust and TypeScript replicas of one definition exchange updates and converge"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clerkenwell-doc = { path = "../clerkenwell-doc" }
clerkenwell-schema = { path = "../clerkenwell-schema" }
serde_json.workspace = true

[features]
# Running against this checkout, for Clerkenwell's own tests.
testing = []

[dev-dependencies]
clerkenwell-conformance = { path = ".", features = ["testing"] }
axum = { version = "0.8.8", default-features = false, features = ["tokio", "http1"] }
base64.workspace = true
clerkenwell-axum = { path = "../clerkenwell-axum" }
clerkenwell-example-notes = { path = "../../examples/notes" }
clerkenwell-notebook = { path = "../clerkenwell-notebook" }
loro.workspace = true
tempfile.workspace = true
tokio = { version = "1.50.0", features = ["macros", "net", "process", "rt-multi-thread"] }
