[package]
name = "clerkenwell-axum"
description = "A reference WebSocket transport for the projection session protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8.8", default-features = false, features = ["ws", "tokio", "http1"] }
clerkenwell-session = { path = "../clerkenwell-session" }
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.50.0", features = ["sync", "macros"] }

[dev-dependencies]
clerkenwell-schema = { path = "../clerkenwell-schema" }
tokio = { version = "1.50.0", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.28.0"
