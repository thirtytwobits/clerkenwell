name: Dependencies

on:
  pull_request:
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'deny.toml'
      - '.github/workflows/dependencies.yml'
  push:
    branches:
      - main
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'deny.toml'
      - '.github/workflows/dependencies.yml'
  schedule:
    - cron: '40 6 * * *'
  workflow_call:

permissions:
  contents: read

jobs:
  advisories:
    name: Advisories
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Refuse yanked crates and advisories in the lockfile
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
